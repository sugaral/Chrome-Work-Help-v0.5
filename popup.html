<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>屏幕识别作答</h1>
      <p class="sub">框选区域 → 视觉模型识别作答</p>
    </div>

    <div id="configStatus" class="config-status"></div>

    <button id="captureBtn" class="primary-btn">框选区域作答</button>
    <button id="fullBtn" class="secondary-btn">识别整个页面</button>

    <p class="tip">
      快捷键 Alt+Q 可直接框选
      <a href="#" id="shortcutLink" class="shortcut-link">（自定义快捷键）</a>
    </p>

    <div class="footer">
      <span class="author-label">By: Ws.Claude / 2026-09-08</span>
      <button id="settingsBtn" class="settings-btn">⚙️ 软件设置</button>
    </div>

    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
